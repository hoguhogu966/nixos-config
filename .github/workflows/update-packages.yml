name: Update custom packages

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-custom-packages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - name: Set up git bot identity
        id: bot
        uses: ./.github/actions/setup-git-bot
        with:
          app-id: ${{ secrets.NIX_UPDATER_APP_ID }}
          private-key: ${{ secrets.NIX_UPDATER_APP_PRIVATE_KEY }}

      - name: Checkout repository with bot token
        uses: actions/checkout@v5
        with:
          token: ${{ steps.bot.outputs.token }}

      - uses: ./.github/actions/setup-nix

      - name: Update pinned package versions and hashes
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: >
          nix shell 'nixpkgs#nix-update' 'nixpkgs#python3' 'nixpkgs#jq'
          --command .github/scripts/update-all.sh

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          set -euo pipefail
          git add pkgs
          if git diff --cached --quiet -- pkgs; then
            echo "No custom package updates found"
            if [ -n "${UPDATE_FAILURES:-}" ]; then
              echo "::error::no package could be updated; failures: ${UPDATE_FAILURES}"
              exit 1
            fi
            exit 0
          fi

          branch=update-custom-packages
          title="chore(pkgs): update custom package versions"
          body=$(cat <<'BODY'
          Automated update of pinned versions and source/dependency hashes under `pkgs/`.

          Updates are generated with `nix-update`; the `rea` npm tarball and upstream lockfile pins are refreshed separately.

          BODY
          )
          if [ -n "${UPDATE_FAILURES:-}" ]; then
            body=$(printf '%s\n\n**Skipped this run (update failed):** %s\n' "$body" "${UPDATE_FAILURES}")
          fi

          git checkout -b "$branch"
          git commit -m "$title"
          git push --force origin "$branch"

          existing=$(gh pr list --head "$branch" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh pr create --title "$title" --body "$body" --base main --head "$branch"
          else
            gh pr edit "$existing" --title "$title" --body "$body"
          fi

          if [ -n "${UPDATE_FAILURES:-}" ]; then
            echo "::error::some package updates failed: ${UPDATE_FAILURES} (successful updates were still turned into a pull request)"
            exit 1
          fi
